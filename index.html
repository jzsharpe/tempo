<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tempo</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#0f1117; --panel:#181b25; --line:#2a2f3d; --text:#f2f4f8; --muted:#8b92a5;
    --neg:#ff6b6b; --hold:#ffd166; --pos:#4ade80; --pause:#60a5fa; --accent:#7c8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  header h1{font-size:18px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .toggle{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer}
  .toggle.on{color:var(--text);border-color:var(--accent)}
  .toggles{display:flex;gap:6px}
  .toggle:disabled{opacity:.4}

  .settings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .field{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:8px 10px 8px 14px}
  .field.wide{grid-column:1/-1;padding-left:12px}
  .field .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
  .field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:2px;white-space:nowrap}
  .field input{width:100%;background:transparent;border:0;outline:0;color:var(--text);
    font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;letter-spacing:.02em}
  .field.wide input{font-size:32px}
  .field input:disabled{opacity:.6}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .stage{flex:1;display:grid;grid-template-columns:64px 1fr;gap:16px;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
  .track{position:relative;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
  .track .puck{position:absolute;left:50%;top:0;width:44px;height:44px;margin-left:-22px;
    border-radius:50%;background:var(--text);box-shadow:0 0 0 6px rgba(255,255,255,.08),0 6px 20px rgba(0,0,0,.5)}
  .track .lbl{position:absolute;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.1em}
  .track .lbl.top{top:-16px}.track .lbl.bot{bottom:-16px}

  .main{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-width:0}
  .phase{font-size:clamp(28px,9vw,44px);font-weight:800;letter-spacing:.04em;text-transform:uppercase;transition:color .15s}
  .count{font-size:clamp(88px,30vw,160px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rep{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rep b{color:var(--text);font-size:26px}

  .bar{display:flex;gap:4px;height:22px;margin-top:14px;width:100%}
  .seg{position:relative;border-radius:6px;overflow:hidden;opacity:.28;transition:opacity .15s;min-width:26px}
  .seg.active{opacity:1}.seg.done{opacity:.55}
  .seg .fill{position:absolute;inset:0;width:0;background:rgba(255,255,255,.35)}
  .seg .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#0b0d12}

  .controls{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}
  button.big{border:0;border-radius:18px;font-size:22px;font-weight:800;padding:20px;cursor:pointer;
    color:#0b0d12;background:var(--pos);letter-spacing:.04em;text-transform:uppercase}
  button.big.pause{background:var(--hold)}
  button.big.reset{background:var(--line);color:var(--text)}
  button.big:active{transform:scale(.98)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;transition:color .2s}
</style>
</head>
<body>
<header>
  <h1>Tempo</h1>
  <div class="toggles">
    <button id="mix" class="toggle" type="button" aria-pressed="false">&#127911; Over my audio</button>
    <button id="sound" class="toggle on" type="button">&#128276; Sound on</button>
  </div>
</header>

<section class="settings">
  <div class="field wide"><label for="reps">Reps</label>
    <input id="reps" type="number" inputmode="numeric" min="1" max="99" step="1" value="8"></div>

  <div class="field"><span class="accent" style="background:var(--neg)"></span>
    <label for="d0">Neg</label>
    <input id="d0" type="number" inputmode="numeric" min="0" max="99" step="1" value="1"></div>
  <div class="field"><span class="accent" style="background:var(--hold)"></span>
    <label for="d1">Hold</label>
    <input id="d1" type="number" inputmode="numeric" min="0" max="99" step="1" value="1"></div>
  <div class="field"><span class="accent" style="background:var(--pos)"></span>
    <label for="d2">Pos</label>
    <input id="d2" type="number" inputmode="numeric" min="0" max="99" step="1" value="1"></div>
  <div class="field"><span class="accent" style="background:var(--pause)"></span>
    <label for="d3">Pause</label>
    <input id="d3" type="number" inputmode="numeric" min="0" max="99" step="1" value="4"></div>
</section>

<section class="stage">
  <div class="track"><div class="lbl top">TOP</div><div class="puck" id="puck"></div><div class="lbl bot">BOTTOM</div></div>
  <div class="main">
    <div class="phase" id="phase">Ready</div>
    <div class="count" id="count">&ndash;</div>
    <div class="rep" id="rep">Rep <b>0</b> / 8</div>
    <div class="bar" id="bar"></div>
  </div>
</section>

<div class="controls">
  <button class="big" id="go" type="button">Go</button>
  <button class="big reset" id="reset" type="button">Reset</button>
</div>
<div class="hint" id="hint"></div>

<script>
(() => {
  const PHASES = [
    {name:'Negative', color:'var(--neg)'},
    {name:'Hold',     color:'var(--hold)'},
    {name:'Positive', color:'var(--pos)'},
    {name:'Pause',    color:'var(--pause)'},
  ];
  const LEAD = 3; // seconds of "get ready" before the first rep
  const $ = id => document.getElementById(id);
  const repsEl=$('reps'), phaseEl=$('phase'), countEl=$('count'), repEl=$('rep'), barEl=$('bar'),
        goBtn=$('go'), resetBtn=$('reset'), puck=$('puck'), soundBtn=$('sound'), mixBtn=$('mix'), hintEl=$('hint');
  const dEls = [$('d0'), $('d1'), $('d2'), $('d3')];
  const allInputs = [repsEl, ...dEls];

  // ---- settings persistence (migrates the old 4-digit rhythm string)
  try {
    const s = JSON.parse(localStorage.getItem('tempo') || '{}');
    if (s.reps) repsEl.value = s.reps;
    if (Array.isArray(s.durs)) s.durs.forEach((v,i) => { if (dEls[i] && v !== '' && v != null) dEls[i].value = v; });
    else if (typeof s.rhythm === 'string')
      (s.rhythm.replace(/\D/g,'') + '0000').slice(0,4).split('').forEach((v,i) => dEls[i].value = v);
    if (s.sound === false) soundBtn.classList.remove('on');
    if (s.mix === true) mixBtn.classList.add('on');
  } catch(e){}
  const save = () => { try { localStorage.setItem('tempo', JSON.stringify({
    reps: repsEl.value, durs: dEls.map(e => e.value), sound: soundBtn.classList.contains('on'), mix: mixBtn.classList.contains('on') })); } catch(e){} };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v) || 0));
  const getReps = () => clamp(parseInt(repsEl.value,10) || 1, 1, 99);
  const getDurs = () => dEls.map(el => clamp(parseInt(el.value,10) || 0, 0, 99));
  const fmt = s => s < 60 ? s + 's' : Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

  // ---- audio
  // iOS quirks this block works around:
  //  * leaving the app puts Web Audio into a WebKit-only "interrupted" state that never clears on its own
  //  * audio can only be (re)started inside a tap
  //  * by default web audio is treated like game sounds and muted by silent mode
  // Two modes, chosen with the "Over my audio" switch:
  //  * media mode (switch off): works in silent mode, but iOS pauses other audio such as an audiobook
  //  * mixing mode (switch on): beeps play over other audio, but silent mode mutes them, so the ringer must be on
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, resumeFailed = false, unlockedAt = 0;
  const soundOn = () => soundBtn.classList.contains('on');
  const mixOn = () => mixBtn.classList.contains('on');
  function applyAudioMode() {
    try { if (navigator.audioSession) navigator.audioSession.type = mixOn() ? 'ambient' : 'playback'; } catch(e){}
    mixBtn.setAttribute('aria-pressed', String(mixOn()));
    mixBtn.disabled = !soundOn();
  }
  applyAudioMode();

  // A looping silent track keeps iOS in media-playback mode during a set, so silent mode can't mute the beeps.
  let keepAlive = null;
  function silentTrack() {
    const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    str(0,'RIFF'); v.setUint32(4, 36 + n, true); str(8,'WAVE'); str(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
    str(36,'data'); v.setUint32(40, n, true); new Uint8Array(buf, 44).fill(128);
    const a = new Audio(URL.createObjectURL(new Blob([buf], {type:'audio/wav'})));
    a.loop = true; a.setAttribute('playsinline', ''); a.preload = 'auto';
    return a;
  }
  function keepAliveOn()  { if (!soundOn() || mixOn()) return; try { keepAlive = keepAlive || silentTrack(); const r = keepAlive.play(); if (r) r.catch(()=>{}); } catch(e){} }
  function keepAliveOff() { try { if (keepAlive) keepAlive.pause(); } catch(e){} }

  // Call only from a tap. Resumes audio, or rebuilds it if iOS left it stuck.
  function unlockAudio() {
    if (!soundOn() || !AC) return;
    try {
      if (ctx && (ctx.state === 'closed' || ctx.state === 'interrupted' || resumeFailed)) {
        try { ctx.close(); } catch(e){}
        ctx = null;
      }
      if (!ctx) {
        const c = ctx = new AC(); resumeFailed = false;
        c.onstatechange = () => { if (c === ctx) soundStatus(); };
      }
      if (ctx.state !== 'running') {
        const c = ctx, r = c.resume(); if (r) r.catch(()=>{});
        setTimeout(() => { if (c === ctx && c.state !== 'running') { resumeFailed = true; soundStatus(); } }, 600);
      }
      unlockedAt = performance.now();
      // starting any sound inside the tap fully unlocks output on iOS
      const src = ctx.createBufferSource(); src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination); src.start(0);
    } catch(e){ resumeFailed = true; }
    soundStatus();
  }
  function beep(freq=880, dur=0.08, vol=0.25) {
    if (!soundOn() || !ctx) return;
    try {
      // Right after a tap the engine may still be starting: queue the beep, it plays a moment later.
      // Otherwise never queue on a stalled clock, or every missed beep would fire at once on recovery.
      if (ctx.state !== 'running' && performance.now() - unlockedAt > 1000) { const r = ctx.resume(); if (r) r.catch(()=>{}); return; }
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
    } catch(e){}
  }
  // If iOS cuts the sound mid-set, say so instead of failing silently.
  let soundWarning = false;
  function soundStatus() {
    const broken = running && soundOn() && (!ctx || ctx.state !== 'running');
    if (broken && !soundWarning) {
      soundWarning = true;
      // give a fresh resume a moment before warning
      setTimeout(() => {
        if (running && soundOn() && (!ctx || ctx.state !== 'running')) {
          hintEl.textContent = 'Sound interrupted · tap anywhere to restore'; hintEl.style.color = 'var(--hold)';
        } else soundWarning = false;
      }, 700);
    } else if (!broken && soundWarning) {
      soundWarning = false;
      // only clear our own warning, never another message such as the ringer reminder
      if (hintEl.textContent.startsWith('Sound interrupted')) { hintEl.style.color = ''; updateHint(); }
    }
  }
  // Any tap anywhere retries audio (touchend/click are the events iOS accepts for this).
  ['touchend', 'click'].forEach(type => document.addEventListener(type, () => {
    if (!soundOn()) return;
    if (!ctx || ctx.state !== 'running' || resumeFailed) unlockAudio();
    if (running) keepAliveOn();
  }, {capture: true, passive: true}));

  soundBtn.onclick = () => {
    soundBtn.classList.toggle('on');
    soundBtn.textContent = soundOn() ? '\u{1F514} Sound on' : '\u{1F515} Sound off'; save(); applyAudioMode();
    if (soundOn()) { unlockAudio(); if (running) keepAliveOn(); beep(660,0.05,0.15); }
    else { keepAliveOff(); soundWarning = true; soundStatus(); }
  };

  mixBtn.onclick = () => {
    mixBtn.classList.toggle('on'); save(); applyAudioMode();
    // switch the audio engine over inside this tap so the new mode takes effect right away
    if (mixOn()) keepAliveOff();
    resumeFailed = true; unlockAudio();
    if (running) keepAliveOn();
    beep(660,0.05,0.15);
    if (mixOn()) ringerReminder();
    else if (!soundWarning) { hintEl.style.color = ''; updateHint(); }
  };

  // Web pages can't see silent mode, so remind about the ringer whenever mixing mode is used.
  const RINGER_MSG = 'Over my audio is on \u00b7 turn silent mode off to hear beeps';
  function ringerReminder() {
    if (!soundOn() || !mixOn()) return;
    hintEl.textContent = RINGER_MSG; hintEl.style.color = 'var(--hold)';
    setTimeout(() => { if (hintEl.textContent === RINGER_MSG) { hintEl.style.color = ''; updateHint(); } }, 4000);
  }

  // ---- wake lock
  let wake = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch(e){}
  }

  // ---- leaving the app pauses the set; tapping Resume brings back the timer and the sound together
  let autoPaused = false;
  function leaveApp() { if (running) { pause(); autoPaused = true; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leaveApp();
    else if (autoPaused) { hintEl.textContent = 'Paused while you were away · tap Resume'; hintEl.style.color = 'var(--hold)'; }
  });
  window.addEventListener('pagehide', leaveApp);

  // ---- timeline
  let segs = [], total = 0, reps = 8, durs = [1,1,1,4];
  let running = false, started = false, elapsedBase = 0, resumeAt = 0, lastSeg = -1, raf = 0;
  let suppressBeep = false;

  function build() {
    reps = getReps(); durs = getDurs();
    segs = []; let t = 0;
    segs.push({rep:0, phase:-1, dur:LEAD, start:0}); t += LEAD;
    for (let r=1; r<=reps; r++) for (let p=0; p<4; p++) {
      if (durs[p] > 0) { segs.push({rep:r, phase:p, dur:durs[p], start:t}); t += durs[p]; }
    }
    total = t;
    renderBar();
    if (!started) repEl.innerHTML = `Rep <b>0</b> / ${reps}`;
    updateHint();
  }
  function updateHint() {
    const per = durs.reduce((a,b) => a+b, 0);
    hintEl.textContent = per
      ? `${reps} reps × ${per}s = ${fmt(reps*per)} · seconds per phase, 0 skips one`
      : 'Enter at least one phase duration';
  }
  function renderBar() {
    barEl.innerHTML = '';
    durs.forEach((d,i) => {
      const s = document.createElement('div'); s.className='seg'; s.dataset.p=i;
      s.style.flex = d > 0 ? String(d) : '0.35'; s.style.background = PHASES[i].color;
      s.innerHTML = `<div class="fill"></div><div class="n">${d}</div>`;
      if (d === 0) s.style.opacity = .12;
      barEl.appendChild(s);
    });
  }

  const elapsed = () => elapsedBase + (running ? (performance.now() - resumeAt)/1000 : 0);

  function setPuck(seg, frac) {
    // 0 = top of the track, 1 = bottom
    let y = 0;
    if (seg.phase === 0) y = frac;           // negative: travel down
    else if (seg.phase === 1) y = 1;         // hold at the bottom
    else if (seg.phase === 2) y = 1 - frac;  // positive: travel up
    else y = 0;                              // pause at the top (and idle)
    const th = puck.parentElement.clientHeight - puck.clientHeight;
    puck.style.transform = `translateY(${(y*th).toFixed(1)}px)`;
  }

  function draw() {
    const e = elapsed();
    if (e >= total) { finish(); return; }
    let i = segs.findIndex(s => e < s.start + s.dur); if (i < 0) i = segs.length-1;
    const seg = segs[i], into = e - seg.start, frac = Math.min(1, into/seg.dur), left = Math.ceil(seg.dur - into - 1e-6);

    if (i !== lastSeg) {
      lastSeg = i;
      if (seg.phase < 0) { phaseEl.textContent='Get ready'; phaseEl.style.color='var(--muted)'; }
      else {
        phaseEl.textContent = PHASES[seg.phase].name; phaseEl.style.color = PHASES[seg.phase].color;
        repEl.innerHTML = `Rep <b>${seg.rep}</b> / ${reps}`;
        const first = segs[i-1] ? segs[i-1].rep !== seg.rep : true;
        if (!suppressBeep) beep(first ? 1046 : 784, first ? 0.12 : 0.07, first ? 0.3 : 0.2);
      }
      suppressBeep = false;
      [...barEl.children].forEach(el => {
        const p = +el.dataset.p; el.classList.toggle('active', p===seg.phase);
        el.classList.toggle('done', seg.phase>=0 && p<seg.phase);
        el.querySelector('.fill').style.width = (seg.phase>=0 && p<seg.phase) ? '100%' : '0';
      });
    }
    if (seg.phase < 0) {
      const n = Math.ceil(seg.dur - into - 1e-6);
      if (countEl.textContent !== String(n)) { countEl.textContent = n; beep(523,0.06,0.15); }
    } else {
      countEl.textContent = Math.max(1, left);
      const act = barEl.children[seg.phase]; if (act) act.querySelector('.fill').style.width = (frac*100).toFixed(1)+'%';
    }
    countEl.style.color = seg.phase < 0 ? 'var(--muted)' : 'var(--text)';
    setPuck(seg, frac);
    raf = requestAnimationFrame(draw);
  }

  function start() {
    if (!started) {
      if (getDurs().reduce((a,b) => a+b, 0) === 0) {
        hintEl.textContent = 'Enter at least one phase duration';
        hintEl.style.color = 'var(--neg)'; setTimeout(() => hintEl.style.color = '', 1400);
        return;
      }
      build(); started = true; elapsedBase = 0; lastSeg = -1;
    } else {
      lastSeg = -1; suppressBeep = true; // repaint the current phase instead of leaving "Paused" up
    }
    running = true; resumeAt = performance.now();
    allInputs.forEach(el => el.disabled = true);
    goBtn.textContent = 'Pause'; goBtn.classList.add('pause');
    autoPaused = false; soundWarning = false; hintEl.style.color = ''; updateHint();
    unlockAudio(); keepAliveOn(); keepAwake(true); ringerReminder();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  }
  function pause() {
    elapsedBase = elapsed(); running = false; cancelAnimationFrame(raf);
    goBtn.textContent = 'Resume'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Paused'; phaseEl.style.color = 'var(--muted)';
    keepAliveOff(); keepAwake(false);
  }
  function reset() {
    running = false; started = false; elapsedBase = 0; lastSeg = -1; cancelAnimationFrame(raf);
    allInputs.forEach(el => el.disabled = false);
    goBtn.textContent = 'Go'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Ready'; phaseEl.style.color = 'var(--text)';
    countEl.textContent = '–'; countEl.style.color = 'var(--text)';
    autoPaused = false; soundWarning = false; hintEl.style.color = '';
    build(); setPuck({phase:-1}, 0); keepAliveOff(); keepAwake(false);
  }
  function finish() {
    running = false; started = false; cancelAnimationFrame(raf);
    allInputs.forEach(el => el.disabled = false);
    goBtn.textContent = 'Go'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Done'; phaseEl.style.color = 'var(--pos)';
    countEl.textContent = '✓'; countEl.style.color = 'var(--pos)';
    repEl.innerHTML = `Rep <b>${reps}</b> / ${reps}`;
    [...barEl.children].forEach(el => { el.classList.remove('active'); el.classList.add('done'); el.querySelector('.fill').style.width='100%'; });
    setPuck({phase:-1}, 0); keepAwake(false);
    beep(1046,0.1,0.3); setTimeout(()=>beep(1318,0.15,0.3), 130); setTimeout(()=>beep(1568,0.25,0.3), 280);
    setTimeout(() => { if (!running) keepAliveOff(); }, 1200);
    soundWarning = false; hintEl.style.color = ''; updateHint();
  }

  goBtn.onclick = () => running ? pause() : start();
  resetBtn.onclick = reset;
  allInputs.forEach(el => {
    el.addEventListener('input', () => { save(); if (!started) build(); });
    el.addEventListener('focus', () => el.select());
    el.addEventListener('blur', () => {
      const lo = el === repsEl ? 1 : 0;
      el.value = clamp(parseInt(el.value,10) || lo, lo, 99);
      save(); if (!started) build();
    });
    el.addEventListener('keydown', e => { if (e.key==='Enter') el.blur(); });
  });
  window.addEventListener('resize', () => { if (!running) setPuck({phase:-1},0); });

  if (!soundOn()) soundBtn.textContent = '\u{1F515} Sound off';
  build(); setPuck({phase:-1}, 0);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
