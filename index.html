<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tempo</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#0f1117; --panel:#181b25; --line:#2a2f3d; --text:#f2f4f8; --muted:#8b92a5;
    --neg:#ff6b6b; --rest:#ffd166; --pos:#4ade80; --hold:#60a5fa; --accent:#7c8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  header h1{font-size:18px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .toggle{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer}
  .toggle.on{color:var(--text);border-color:var(--accent)}

  .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .field label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .field input{width:100%;background:transparent;border:0;outline:0;color:var(--text);
    font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;letter-spacing:.06em}
  .field input:disabled{opacity:.6}
  .legend{grid-column:1/-1;display:flex;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .stage{flex:1;display:grid;grid-template-columns:64px 1fr;gap:16px;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
  .track{position:relative;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
  .track .puck{position:absolute;left:50%;top:0;width:44px;height:44px;margin-left:-22px;margin-top:0;
    border-radius:50%;background:var(--text);box-shadow:0 0 0 6px rgba(255,255,255,.08),0 6px 20px rgba(0,0,0,.5);
    transform:translateY(calc(var(--y,0) * (100% + 0px)))}
  .track .lbl{position:absolute;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.1em}
  .track .lbl.top{top:-16px}.track .lbl.bot{bottom:-16px}

  .main{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-width:0}
  .phase{font-size:clamp(28px,9vw,44px);font-weight:800;letter-spacing:.04em;text-transform:uppercase;transition:color .15s}
  .count{font-size:clamp(96px,32vw,170px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rep{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rep b{color:var(--text);font-size:26px}

  .bar{display:flex;gap:4px;height:22px;margin-top:14px;width:100%}
  .seg{position:relative;border-radius:6px;overflow:hidden;opacity:.28;transition:opacity .15s}
  .seg.active{opacity:1}.seg.done{opacity:.55}
  .seg .fill{position:absolute;inset:0;width:0;background:rgba(255,255,255,.35)}
  .seg .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#0b0d12}

  .controls{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}
  button.big{border:0;border-radius:18px;font-size:22px;font-weight:800;padding:20px;cursor:pointer;
    color:#0b0d12;background:var(--pos);letter-spacing:.04em;text-transform:uppercase}
  button.big.pause{background:var(--rest)}
  button.big.reset{background:var(--line);color:var(--text)}
  button.big:active{transform:scale(.98)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Tempo</h1>
  <button id="sound" class="toggle on" type="button">🔔 Sound on</button>
</header>

<section class="settings">
  <div class="field"><label for="reps">Reps</label>
    <input id="reps" type="number" inputmode="numeric" min="1" max="99" value="8"></div>
  <div class="field"><label for="rhythm">Rhythm</label>
    <input id="rhythm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="1114" placeholder="1114"></div>
  <div class="legend">
    <span><i style="background:var(--neg)"></i>Negative</span>
    <span><i style="background:var(--rest)"></i>Rest</span>
    <span><i style="background:var(--pos)"></i>Positive</span>
    <span><i style="background:var(--hold)"></i>Hold</span>
  </div>
</section>

<section class="stage">
  <div class="track"><div class="lbl top">TOP</div><div class="puck" id="puck"></div><div class="lbl bot">BOTTOM</div></div>
  <div class="main">
    <div class="phase" id="phase">Ready</div>
    <div class="count" id="count">–</div>
    <div class="rep" id="rep">Rep <b>0</b> / 8</div>
    <div class="bar" id="bar"></div>
  </div>
</section>

<div class="controls">
  <button class="big" id="go" type="button">Go</button>
  <button class="big reset" id="reset" type="button">Reset</button>
</div>
<div class="hint" id="hint">Rhythm digits: negative · rest · positive · hold (seconds). Use 0 to skip a phase.</div>

<script>
(() => {
  const PHASES = [
    {name:'Negative', color:'var(--neg)',  key:'neg'},
    {name:'Rest',     color:'var(--rest)', key:'rest'},
    {name:'Positive', color:'var(--pos)',  key:'pos'},
    {name:'Hold',     color:'var(--hold)', key:'hold'},
  ];
  const LEAD = 3; // seconds of "get ready" before the first rep
  const $ = id => document.getElementById(id);
  const repsEl=$('reps'), rhythmEl=$('rhythm'), phaseEl=$('phase'), countEl=$('count'),
        repEl=$('rep'), barEl=$('bar'), goBtn=$('go'), resetBtn=$('reset'), puck=$('puck'), soundBtn=$('sound');

  // ---- settings persistence
  try {
    const s = JSON.parse(localStorage.getItem('tempo') || '{}');
    if (s.reps) repsEl.value = s.reps;
    if (s.rhythm) rhythmEl.value = s.rhythm;
    if (s.sound === false) soundBtn.classList.remove('on');
  } catch(e){}
  const save = () => { try { localStorage.setItem('tempo', JSON.stringify({
    reps: repsEl.value, rhythm: rhythmEl.value, sound: soundBtn.classList.contains('on') })); } catch(e){} };

  const getReps = () => Math.max(1, Math.min(99, parseInt(repsEl.value,10) || 1));
  const getDurs = () => {
    const d = (rhythmEl.value.replace(/\D/g,'') + '0000').slice(0,4).split('').map(Number);
    return d;
  };

  // ---- audio
  let ctx = null;
  const soundOn = () => soundBtn.classList.contains('on');
  function beep(freq=880, dur=0.08, vol=0.25) {
    if (!soundOn()) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
    } catch(e){}
  }
  soundBtn.onclick = () => { soundBtn.classList.toggle('on');
    soundBtn.textContent = soundOn() ? '🔔 Sound on' : '🔕 Sound off'; save(); if (soundOn()) beep(660,0.05,0.15); };

  // ---- wake lock
  let wake = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch(e){}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && running) keepAwake(true); });

  // ---- timeline
  let segs = [], total = 0, reps = 8, durs = [1,1,1,4];
  let running = false, started = false, elapsedBase = 0, resumeAt = 0, lastSeg = -1, raf = 0;

  function build() {
    reps = getReps(); durs = getDurs();
    segs = []; let t = 0;
    segs.push({rep:0, phase:-1, dur:LEAD, start:0}); t += LEAD;
    for (let r=1; r<=reps; r++) for (let p=0; p<4; p++) {
      if (durs[p] > 0) { segs.push({rep:r, phase:p, dur:durs[p], start:t}); t += durs[p]; }
    }
    total = t;
    renderBar();
    repEl.innerHTML = `Rep <b>0</b> / ${reps}`;
  }
  function renderBar() {
    barEl.innerHTML = '';
    durs.forEach((d,i) => {
      const s = document.createElement('div'); s.className='seg'; s.dataset.p=i;
      s.style.flex = d > 0 ? String(d) : '0.35'; s.style.background = PHASES[i].color;
      s.innerHTML = `<div class="fill"></div><div class="n">${d}</div>`;
      if (d === 0) s.style.opacity = .12;
      barEl.appendChild(s);
    });
  }

  const elapsed = () => elapsedBase + (running ? (performance.now() - resumeAt)/1000 : 0);

  function setPuck(seg, frac) {
    // 0 = top, 1 = bottom
    let y = 0;
    if (seg.phase === 0) y = frac;           // negative: go down
    else if (seg.phase === 1) y = 1;         // rest at bottom
    else if (seg.phase === 2) y = 1 - frac;  // positive: come up
    else if (seg.phase === 3) y = 0;         // hold at top
    else y = 0;
    puck.style.setProperty('--y', y.toFixed(4));
    // the puck's own height must be subtracted: use track height minus puck size
    const th = puck.parentElement.clientHeight - puck.clientHeight;
    puck.style.transform = `translateY(${(y*th).toFixed(1)}px)`;
  }

  function draw() {
    const e = elapsed();
    if (e >= total) { finish(); return; }
    let i = segs.findIndex(s => e < s.start + s.dur); if (i < 0) i = segs.length-1;
    const seg = segs[i], into = e - seg.start, frac = Math.min(1, into/seg.dur), left = Math.ceil(seg.dur - into - 1e-6);

    if (i !== lastSeg) {
      lastSeg = i;
      if (seg.phase < 0) { phaseEl.textContent='Get ready'; phaseEl.style.color='var(--muted)'; }
      else {
        phaseEl.textContent = PHASES[seg.phase].name; phaseEl.style.color = PHASES[seg.phase].color;
        repEl.innerHTML = `Rep <b>${seg.rep}</b> / ${reps}`;
        const first = seg.phase === 0 || segs[i-1]?.rep !== seg.rep;
        beep(first ? 1046 : 784, first ? 0.12 : 0.07, first ? 0.3 : 0.2);
      }
      [...barEl.children].forEach(el => {
        const p = +el.dataset.p; el.classList.toggle('active', p===seg.phase);
        el.classList.toggle('done', seg.phase>=0 && p<seg.phase);
        el.querySelector('.fill').style.width = (seg.phase>=0 && p<seg.phase) ? '100%' : '0';
      });
    }
    if (seg.phase < 0) {
      const n = Math.ceil(seg.dur - into - 1e-6);
      if (countEl.textContent !== String(n)) { countEl.textContent = n; beep(523,0.06,0.15); }
    } else {
      countEl.textContent = Math.max(1, left);
      const act = barEl.children[seg.phase]; if (act) act.querySelector('.fill').style.width = (frac*100).toFixed(1)+'%';
    }
    countEl.style.color = seg.phase < 0 ? 'var(--muted)' : 'var(--text)';
    setPuck(seg, frac);
    raf = requestAnimationFrame(draw);
  }

  function start() {
    if (!started) { build(); started = true; elapsedBase = 0; lastSeg = -1; }
    running = true; resumeAt = performance.now();
    repsEl.disabled = rhythmEl.disabled = true;
    goBtn.textContent = 'Pause'; goBtn.classList.add('pause');
    keepAwake(true); beep(660,0.05,0.01); // prime audio on user gesture
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  }
  function pause() {
    elapsedBase = elapsed(); running = false; cancelAnimationFrame(raf);
    goBtn.textContent = 'Resume'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Paused'; phaseEl.style.color = 'var(--muted)';
    keepAwake(false);
  }
  function reset() {
    running = false; started = false; elapsedBase = 0; lastSeg = -1; cancelAnimationFrame(raf);
    repsEl.disabled = rhythmEl.disabled = false;
    goBtn.textContent = 'Go'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Ready'; phaseEl.style.color = 'var(--text)';
    countEl.textContent = '–'; countEl.style.color = 'var(--text)';
    build(); setPuck({phase:-1}, 0); keepAwake(false);
  }
  function finish() {
    running = false; started = false; cancelAnimationFrame(raf);
    repsEl.disabled = rhythmEl.disabled = false;
    goBtn.textContent = 'Go'; goBtn.classList.remove('pause');
    phaseEl.textContent = 'Done'; phaseEl.style.color = 'var(--pos)';
    countEl.textContent = '✓'; countEl.style.color = 'var(--pos)';
    repEl.innerHTML = `Rep <b>${reps}</b> / ${reps}`;
    [...barEl.children].forEach(el => { el.classList.remove('active'); el.classList.add('done'); el.querySelector('.fill').style.width='100%'; });
    setPuck({phase:-1}, 0); keepAwake(false);
    beep(1046,0.1,0.3); setTimeout(()=>beep(1318,0.15,0.3), 130); setTimeout(()=>beep(1568,0.25,0.3), 280);
  }

  goBtn.onclick = () => running ? pause() : start();
  resetBtn.onclick = reset;
  repsEl.addEventListener('input', () => { save(); if (!started) build(); });
  rhythmEl.addEventListener('input', () => { rhythmEl.value = rhythmEl.value.replace(/\D/g,'').slice(0,4); save(); if (!started) build(); });
  [repsEl, rhythmEl].forEach(el => el.addEventListener('keydown', e => { if (e.key==='Enter') el.blur(); }));
  window.addEventListener('resize', () => { if (!running) setPuck({phase:-1},0); });

  if (!soundOn()) soundBtn.textContent = '🔕 Sound off';
  build(); setPuck({phase:-1}, 0);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
